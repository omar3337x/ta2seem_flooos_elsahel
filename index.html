<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة تقسيم الرحلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Cairo,sans-serif;background:#f8fafc;max-width:1200px;margin:auto;padding:20px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px;margin-bottom:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:10px;text-align:center}
.stat b{font-size:22px}
.person{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin-top:10px}
input,select,button,textarea{padding:10px;border-radius:10px;border:1px solid #cbd5e1;font-family:Cairo}
button{background:#2563eb;color:#fff;border:none;cursor:pointer}
.remove{background:#dc2626}
textarea{width:100%;height:260px}
@media(max-width:700px){.person{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>حاسبة الرحلة</h1>

<div class="card">
الإيجار <input type="number" id="rent" value="14000">
المواصلات <input type="number" id="transport" value="4200">
<button onclick="addPerson()">إضافة شخص</button>
<button onclick="calculate()">احسب</button>
</div>

<div class="stats">
<div class="stat">عدد الأشخاص<br><b id="peopleCount">0</b></div>
<div class="stat">الإجمالي<br><b id="totalCost">18200</b></div>
</div>

<div class="card" id="people"></div>

<div class="card">
<button onclick="copyResult()">نسخ النتيجة</button>
<textarea id="result"></textarea>
</div>

<script>
const allNames=["عمر الجمل","ابوضيف","مؤمن مصطفي","عطار","فوزي","حسين","عبدالله","الخولي"];

function getSelectedNames(){
 return [...document.querySelectorAll('.nameSelect')].map(x=>x.value).filter(Boolean);
}

function refreshNames(){
 const selected=getSelectedNames();
 document.querySelectorAll('.nameSelect').forEach(select=>{
   const cur=select.value;
   select.innerHTML='<option value="">اختر شخص</option>';
   allNames.forEach(name=>{
      if(!selected.includes(name)||name===cur){
        const o=document.createElement('option');
        o.value=name;o.textContent=name;
        if(name===cur) o.selected=true;
        select.appendChild(o);
      }
   });
 });
}

function addPerson(){
 const div=document.createElement('div');
 div.className='person';
 div.innerHTML=`
 <select class="nameSelect" onchange="refreshNames()"><option value="">اختر شخص</option></select>
 <input type="number" class="days" value="4" min="1">
 <select class="transportType">
 <option value="none">بدون مواصلات</option>
 <option value="go">ذهاب فقط</option>
 <option value="return">عودة فقط</option>
 <option value="both" selected>ذهاب وعودة</option>
 </select>
 <button class="remove" onclick="this.parentElement.remove();refreshNames();updateStats()">حذف</button>`;
 document.getElementById('people').appendChild(div);
 refreshNames(); updateStats();
}

function updateStats(){
 document.getElementById('peopleCount').textContent=document.querySelectorAll('.person').length;
 document.getElementById('totalCost').textContent=(+rent.value)+(+transport.value);
}

function round5(x){return Math.ceil(x/5)*5;}

function calculate(){
 const rentVal=+rent.value, transVal=+transport.value;
 const persons=[...document.querySelectorAll('.person')];
 let totalDays=0,totalTrips=0,data=[];

 persons.forEach(p=>{
  let days=+p.querySelector('.days').value;
  let type=p.querySelector('.transportType').value;
  let trips=(type==='both'?2:(type==='none'?0:1));
  totalDays+=days; totalTrips+=trips;
  data.push({name:p.querySelector('.nameSelect').value||'شخص',days,type,trips});
 });

 let dayCost=rentVal/totalDays;
 let tripCost=totalTrips?transVal/totalTrips:0;
 let txt='';

 data.forEach(p=>{
   let rentShare=round5(dayCost*p.days);
   let transShare=round5(tripCost*p.trips);
   let total=round5(dayCost*p.days+tripCost*p.trips);

   if(p.type==='none'){
      txt+=`• ${p.name}: ${rentShare} جنيه بدون مواصلات\n`;
   }else{
      let label='مواصلات';
      if(p.type==='go') label='مواصلات ذهاب';
      if(p.type==='return') label='مواصلات عودة';
      txt+=`• ${p.name}: ${rentShare} سكن + ${transShare} ${label} = ${total} جنيه\n`;
   }
 });

 result.value=txt;
}

function copyResult(){
 navigator.clipboard.writeText(result.value);
 alert('تم النسخ');
}

for(let i=0;i<8;i++) addPerson();
</script>
</body>
</html>
