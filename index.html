<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حاسبة الرحلة - Responsive</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:Cairo,sans-serif;margin:0;background:#f8fafc;padding:12px}
.container{max-width:1100px;margin:auto}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin-bottom:12px}
h1{font-size:1.4rem;margin:0 0 12px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;text-align:center}
.person{display:grid;grid-template-columns:2fr 1fr 1.2fr auto;gap:8px;margin-top:10px}
input,select,button,textarea{width:100%;padding:12px;border-radius:10px;font-family:Cairo}
input,select,textarea{border:1px solid #cbd5e1}
button{border:none;background:#2563eb;color:#fff}
.remove{background:#dc2626}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{width:auto}
textarea{min-height:260px}
@media (max-width:768px){
  body{padding:8px}
  .inputs,.stats{grid-template-columns:1fr}
  .person{grid-template-columns:1fr}
  h1{font-size:1.2rem}
  button,input,select{font-size:16px}
}
</style>
</head>
<body>
<div class="container">
<h1>حاسبة الرحلة</h1>
<div class="card">
<div class="inputs">
<div><label>الإيجار</label><input value="14000"></div>
<div><label>المواصلات</label><input value="4200"></div>
</div>
<p>نسخة محسنة للموبايل: جميع الحقول تتكدس تلقائياً على الشاشات الصغيرة.</p>
</div>
</div>
</body>
</html>
